<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title>
<meta name="description" content="Page introuvable.">
<style>  :root { --red: #d40000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050203; color: #e8dcd6; font-family: "Courier New", monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .12; }
  .box { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; }
  h1 { font-size: clamp(80px, 22vw, 200px); margin: 0; color: var(--red); letter-spacing: .05em; text-shadow: 3px 0 #0ff, -3px 0 #f0f, 0 0 30px rgba(212,0,0,.6); }
  p { font-size: 20px; margin: 10px 0; min-height: 1.4em; }
  .hide { opacity: 0; transition: opacity 1.2s; }
  .show { opacity: 1; }
  a.btn { display: inline-block; margin-top: 20px; padding: 10px 22px; border: 1px solid var(--red); color: #fff; background: #5a0000; text-decoration: none; font-size: 20px; letter-spacing: .1em; }
  a.btn:hover { background: var(--red); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff2b2b; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<canvas id="n" aria-hidden="true"></canvas>
<div class="box">
  <div>
    <h1>404</h1>
    <p>Cette page n'existe pas.</p>
    <p id="l2" class="hide">Comme tous ceux qu'ils ont effacés.</p>
    <p id="l3" class="hide">Tu cherchais quelque chose ? <b>Lui aussi.</b></p>
    <div id="l4" class="hide"><a class="btn" id="go" href="redroom.html"><span class="dot"></span> REGARDER LE DIRECT</a></div>
  </div>
</div>
<script>(() => {
  let base = "/";
  const seg = location.pathname.split("/").filter(Boolean);
  if (location.hostname.endsWith("github.io") && seg.length && !location.hostname.startsWith(seg[0])) {
    const known = ["employes", "redroom.html", "cam03", "404.html", "index.html"];
    if (!known.includes(seg[0])) base = "/" + seg[0] + "/";
  } else if (location.protocol === "file:") base = "";
  document.getElementById("go").href = base + "redroom.html";
  const c = document.getElementById("n"), x = c.getContext("2d");
  c.width = 160; c.height = 90; const im = x.createImageData(160, 90);
  setInterval(() => { for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = v; im.data[i + 1] = im.data[i + 2] = v * .5; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); }, 80);
  [["l2", 1800], ["l3", 3800], ["l4", 6000]].forEach(([id, t]) => setTimeout(() => document.getElementById(id).classList.add("show"), t));
  document.title = "404 · " + location.pathname.split("/").pop();
})();
</script>
</body>
</html>
